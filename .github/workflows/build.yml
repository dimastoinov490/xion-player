name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Environment & Accept Licenses
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
        # Создаем local.properties, чтобы Gradle знал путь к SDK
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

        # Автоматически принимаем все лицензии (чтобы сборка не зависала)
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Устанавливаем нужные инструменты и платформу (версия 34)
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Generate Gradle Wrapper & Build APK
      run: |
        # Генерируем недостающий файл gradlew прямо на сервере GitHub
        gradle wrapper
        
        # Даем права на выполнение и запускаем сборку
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
