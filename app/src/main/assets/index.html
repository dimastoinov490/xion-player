<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyper Player</title>
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #16161f;
            --accent-color: #2f80ed;
            --text-main: #f0f0fff5;
            --text-secondary: #8e8e93;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: rgba(22, 22, 31, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 40px;
        }

        .welcome-card p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(47, 128, 237, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>Hyper Player</h1>
    </header>

    <div class="container">
        <div class="welcome-card">
            <h2 style="margin-top: 0; font-size: 18px;">Добро пожаловать</h2>
            <p>Современный всеядный движок на базе WebView и Native Core готов к работе.</p>
            <button class="btn" onclick="openFileExplorer()">📂 Выбрать видеофайл</button>
        </div>
    </div>

    <script>
        function openFileExplorer() {
            // Мост для вызова нативного проводника Android из JavaScript
            if (window.AndroidBridge) {
                window.AndroidBridge.openChooser();
            } else {
                alert("Интерфейс WebView успешно загружен!");
            }
        }
    </script>
</body>
</html>
